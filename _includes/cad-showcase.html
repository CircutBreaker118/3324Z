<section
  class="page-section page-section--foreground cad-showcase"
  id="lift-showcase"
  data-reveal
>
  <h2>CAD Preview — 3324Z Lift</h2>
  <p class="cad-showcase__intro">
    This is a preview of the CAD assembly for our lift mechanism, straight from the design files — not a photo.
  </p>

  <div class="cad-showcase__stage">
    <!--
      The interactive Three.js/GLB viewer below is intentionally disabled.
      Reason: letting visitors freely zoom/rotate the live model lets other
      VEX teams count the mounting-hole pattern on the C-channel/plate parts
      and reverse-engineer exact hole spacing/part dimensions (competitive
      intelligence concern). A static, hole-blurred render is shown instead
      (see the <figure class="cad-showcase__static"> block right below this
      comment, which uses assets/images/dum-e/cad-render-blurred.png).

      To re-enable the live viewer later:
        1. Restore the `data-model-src` attribute (pointing at
           /assets/cad/robot.glb via relative_url) on the <section> tag above.
        2. Uncomment the .cad-showcase__viewer block and the
           .cad-showcase__fallback block below.
        3. Remove (or hide) the <figure class="cad-showcase__static"> block.
        4. Uncomment the <script type="importmap"> and
           <script type="module" src=".../robot-viewer.js"> tags at the
           bottom of this file.

    <div class="cad-showcase__viewer" id="lift-showcase-viewer">
      <canvas
        id="lift-showcase-canvas"
        class="cad-showcase__canvas"
        role="img"
        aria-label="Interactive 3D viewer of the 3324Z lift mechanism CAD model — drag to rotate, scroll to zoom; the lift arm animates up and down on its own"
      ></canvas>
      <p class="cad-showcase__hint" aria-hidden="true">Drag to rotate · Scroll to zoom · Lift animates on its own</p>
      <div class="cad-showcase__loading" id="lift-showcase-loading" role="status" aria-live="polite">
        <span class="cad-showcase__spinner" aria-hidden="true"></span>
        <span class="cad-showcase__loading-text" id="lift-showcase-loading-text">Loading 3D model…</span>
      </div>
    </div>

    <div class="cad-showcase__fallback" id="lift-showcase-fallback">
      <img
        src="{{ '/assets/images/dum-e/cad-render.png' | relative_url }}"
        alt="Static preview of the 3324Z lift mechanism CAD assembly, shown as an isometric render"
        loading="lazy"
        decoding="async"
        width="1330"
        height="1232"
      />
      <p id="lift-showcase-fallback-text">
        A live 3D view isn't available in this browser right now — here's a static preview of the CAD assembly instead.
      </p>
    </div>
    -->

    <figure class="cad-showcase__static">
      <img
        src="{{ '/assets/images/dum-e/cad-render-blurred.png' | relative_url }}"
        alt="Static isometric preview of the 3324Z lift mechanism CAD assembly, with the mounting-hole pattern softened"
        loading="lazy"
        decoding="async"
        width="1330"
        height="1232"
      />
      <figcaption>Isometric CAD render of our lift mechanism.</figcaption>
    </figure>
  </div>

  <div class="cad-showcase__photos">
    <p class="cad-showcase__photos-label">Build progress in the shop</p>
    <div class="cad-showcase__photos-grid">
      <figure class="cad-showcase__photo">
        <img
          src="{{ '/assets/images/dum-e/build-stage-1.jpg' | relative_url }}"
          alt="Build stage 1: an early lift frame with crossed uprights test-fit on the robot chassis"
          loading="lazy"
          decoding="async"
          width="1200"
          height="1600"
        />
        <figcaption>First uprights test-fit on the drivetrain, before any top crossmembers.</figcaption>
      </figure>
      <figure class="cad-showcase__photo">
        <img
          src="{{ '/assets/images/dum-e/build-stage-2.jpg' | relative_url }}"
          alt="Build stage 2: the lift frame with a rectangular top crossmember added, taller than stage 1"
          loading="lazy"
          decoding="async"
          width="1200"
          height="1600"
        />
        <figcaption>A rectangular top crossmember goes on and the frame gains height.</figcaption>
      </figure>
      <figure class="cad-showcase__photo">
        <img
          src="{{ '/assets/images/dum-e/build-stage-3.jpg' | relative_url }}"
          alt="Build stage 3: a taller lift tower with extra diagonal bracing, mid-build"
          loading="lazy"
          decoding="async"
          width="1200"
          height="1600"
        />
        <figcaption>Extra bracing and a taller tower — the most recent in-shop progress shot.</figcaption>
      </figure>
    </div>
  </div>
</section>

<!--
  Live-viewer bootstrap scripts, disabled along with the viewer markup
  above (see the comment in .cad-showcase__stage for why and how to
  re-enable). Uncomment both tags below when re-enabling the viewer.

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
</script>
<script type="module" src="{{ '/assets/js/robot-viewer.js' | relative_url }}"></script>
-->
